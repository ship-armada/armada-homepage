# ABOUTME: CI workflow that tests, typechecks, and builds the site on PRs to main.
# ABOUTME: Runs npm ci, npm test (Vitest), and npm run build (which runs tsc, then vite build).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

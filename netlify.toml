# ABOUTME: Netlify build and routing config for the Armada marketing site.
# ABOUTME: Mirrors vercel.json — Vite MPA build, clean URLs, homepage aliases. The token.armada.blue alias is Netlify-only.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Netlify serves clean URLs by default: /homepage -> homepage.html,
# /about -> about.html, /systemdocs -> systemdocs.html, and / -> index.html.
# The rewrites below only cover the homepage2..homepage5 aliases that have no
# matching file.
[[redirects]]
  from = "/homepage2"
  to = "/homepage.html"
  status = 200

[[redirects]]
  from = "/homepage3"
  to = "/homepage.html"
  status = 200

[[redirects]]
  from = "/homepage4"
  to = "/homepage.html"
  status = 200

[[redirects]]
  from = "/homepage5"
  to = "/homepage.html"
  status = 200

# token.armada.blue is a domain alias of this site; its root serves the ARM allocation page.
# force = true because "/" already exists (index.html) and would otherwise shadow the rewrite.
# /assets/* and /videos/* are real files on the same site, so they serve on either host.
[[redirects]]
  from = "https://token.armada.blue/"
  to = "/allocation.html"
  status = 200
  force = true

# token.armada.blue is the allocation page's one public URL. force = true because clean URLs
# would otherwise serve allocation.html at /allocation.
[[redirects]]
  from = "/allocation"
  to = "https://token.armada.blue/"
  status = 301
  force = true

# /discord is the one Discord link the site and posts use, so a new invite only changes this rule.
# 302 rather than 301 so browsers don't cache the invite and miss a later change.
[[redirects]]
  from = "/discord"
  to = "https://discord.gg/fjWquSpFjb"
  status = 302
  force = true
